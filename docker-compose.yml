services:
  db:
    image: postgres:15
    container_name: db-dragons
    environment:
      - POSTGRES_DB=study
      - POSTGRES_USER=study
      - POSTGRES_PASSWORD=study
    ports:
      - 5434:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - is-backend
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - is-backend
  dragons:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docker.io/dllnnx/is:dragons
    container_name: dragons
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    ports:
      - "8080:8080"
    networks:
      - is-backend
      - is-frontend
    depends_on:
      - minio
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: is-frontend
    image: docker.io/dllnnx/is:frontend
    ports:
      - "80:80"
    networks:
      - is-frontend

volumes:
  pg_data:
  minio_data:

networks:
  is-backend:
    name: is-backend
  is-frontend:
    name: is-frontend
